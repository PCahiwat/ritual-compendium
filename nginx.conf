server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # CSP with unsafe-eval for Bedrock Passport SDK
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: *; style-src 'self' 'unsafe-inline' https: *; connect-src 'self' https: wss: *; img-src 'self' data: https: blob: *; font-src 'self' data: https: *; media-src 'self' https: *; object-src 'none'; frame-src 'self' https: *;" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-add CSP for asset responses too
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: *; style-src 'self' 'unsafe-inline' https: *; connect-src 'self' https: wss: *; img-src 'self' data: https: blob: *; font-src 'self' data: https: *; media-src 'self' https: *; object-src 'none'; frame-src 'self' https: *;" always;
    }

    # Cache data files
    location /data/ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
